name: CI

on:
  push:
    branches: [main, "milestone/**"]
  pull_request:
    branches: [main, "milestone/**"]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: PII static scan (roadmap §8.3, must be 0 hits)
        shell: bash
        run: |
          # 禁止读取应用名 / 窗口标题 / 输入内容 / 麦克风(隐私边界 — 关键约束 4)
          HITS=$(grep -rn "messages\.content\|getUserMedia\|GetForegroundWindow" src/ src-tauri/src/ || true)
          if [ -n "$HITS" ]; then
            echo "::error::PII scan failed (privacy boundary violation):"
            echo "$HITS"
            exit 1
          fi
          echo "PII scan: 0 hits ✓"

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check

      - name: Cargo test
        working-directory: src-tauri
        run: cargo test

      # Vitest 占位:M2 实施 PersonaService / ChatService 时启用
      # - name: Vitest
      #   run: pnpm test
