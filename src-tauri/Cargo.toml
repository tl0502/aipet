[package]
name = "aipet"
version = "0.0.0"
description = "AI 桌宠 — 由你亲手塑造、会主动关心你、能和你一起玩的 AI 桌宠"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "aipet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
windows = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Security_Cryptography"] }

# H.1 PersonaService:gray_matter 解 frontmatter / sqlx 直连 plugin 创建的 sqlite
# (tauri-plugin-sql 2.4 的 DbPool 公共方法被注释掉,Rust 端无法借 plugin 的 Pool,只能自开)
# sqlx 版本必须与 plugin 一致(0.8)避免 transitive 飘移;default-features = false 砍掉非必要 feature
gray_matter = { version = "0.2", default-features = false, features = ["yaml"] }
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }

# F.1 MemoryService:messages.id 走 ULID(schema 注释明写;时间序利于 (conversation_id, created_at) 索引)
ulid = "1"

# B.1 LLMProvider:OpenAI 兼容 streaming chat completion(架构 §6 / ADR-005)
# - reqwest 0.12:rustls-tls 砍 native OpenSSL 依赖;stream feature 启用 bytes_stream();json 简化序列化
# - eventsource-stream:SSE 协议解析(处理 \r\n / chunk 跨包断行;hand-roll 易丢边界)
# - futures:BoxStream / StreamExt 通用 stream 工具
# - async-stream:try_stream! 宏把 reqwest stream + SSE 解析合并成 Stream<ChatChunk>
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
eventsource-stream = "0.2"
futures = "0.3"
async-stream = "0.3"

# 仅桌面平台启用全局快捷键(避免 mobile 编译报错;M1-M5 不上 mobile,提前规范)
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-global-shortcut = "2"

# DB 集成测试 dev-deps(2026-05-04 新增,详 progress/test-coverage-2026-05-04.md):
# - tempfile:每个测试一份独立 .db 文件,避免共享状态串味;Drop 自动清理
# - tokio macros + rt:async 测试用 #[tokio::test] 宏(sqlx::test 宏依赖 tokio runtime)
# - 不引 sqlx::test 宏:它默认创建 PostgreSQL/MySQL DB,SQLite 路径需 sqlite_test_runner,
#   配置成本 > tempfile + apply migrations 手卷方式
[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.dev]
incremental = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
